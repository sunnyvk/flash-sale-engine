# Prometheus + Grafana. A third overlay, used on top of the full stack:
#   docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/docker-compose.app.yml \
#                  -f deploy/docker-compose.observability.yml up -d --wait        (or: make obs-up)
# Needs GRAFANA_ADMIN_PASSWORD in .env. Both UIs bind to loopback only: Prometheus http://localhost:9090,
# Grafana http://localhost:3000 (user "admin"). Prometheus pulls /actuator/prometheus from each service over the
# internal network; the services never push anything.

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: fs-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d          # a week of history is plenty for a demo and keeps the disk small
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy | grep -qi healthy"]   # 127.0.0.1, not localhost (IPv6 first on Alpine/busybox)
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: fs-grafana
    depends_on:
      prometheus: { condition: service_healthy }
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env to use the observability overlay}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 384m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
