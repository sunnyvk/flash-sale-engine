# Edge proxy: the ONLY container that publishes a port in the full-stack compose.
# Phase 9 adds TLS on 443; the security group then exposes just 80/443.

limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;     # per client IP, across ALL usernames
limit_req_status 429;

upstream booking { server booking-service:8081; keepalive 32; }

server {
    listen 80;
    server_tokens off;
    client_max_body_size 16k;                                    # booking/auth bodies are tiny

    # Login/register/refresh: a second brute-force guard in front of the per-username limiter inside the app.
    # It covers what that one cannot: one IP trying many usernames.
    location /api/v1/auth/ {
        limit_req zone=auth burst=20 nodelay;
        include /etc/nginx/proxy_params.conf;
        proxy_pass http://booking;
    }

    location /api/ {
        include /etc/nginx/proxy_params.conf;
        proxy_pass http://booking;
    }

    # Liveness for load balancers and the smoke test. Only readiness is exposed; no other actuator endpoint is reachable.
    location = /healthz {
        access_log off;
        proxy_pass http://booking/actuator/health/readiness;
    }

    location / { return 404; }
}
