# Single-node Kafka in KRaft mode (no ZooKeeper). Good for kind/minikube; production would run 3 brokers.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: flash-sale
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: {app: kafka}
  template:
    metadata:
      labels: {app: kafka}
    spec:
      # REQUIRED here: the image turns every KAFKA_* env var into a broker setting, and Kubernetes would otherwise
      # inject KAFKA_PORT=tcp://... and KAFKA_SERVICE_HOST for the Service named "kafka".
      enableServiceLinks: false
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}   # fsGroup makes the volume writable by uid 1000
      containers:
      - name: kafka
        image: apache/kafka:3.9.0
        ports:
        - {name: kafka, containerPort: 9092}
        env:
        - {name: KAFKA_NODE_ID, value: "1"}
        - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
        - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
        - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
        - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092"}
        - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
        - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER"}
        - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT"}
        - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
        - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
        - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
        - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
        - {name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data"}
        - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
        - {name: KAFKA_HEAP_OPTS, value: "-Xmx512m -Xms256m"}
        resources:
          requests: {cpu: 100m, memory: 512Mi}
          limits: {memory: 1Gi}
        startupProbe:
          tcpSocket: {port: kafka}
          periodSeconds: 5
          failureThreshold: 36
        readinessProbe:
          tcpSocket: {port: kafka}
          periodSeconds: 10
        volumeMounts:
        - {name: data, mountPath: /var/lib/kafka/data}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests: {storage: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: flash-sale
spec:
  selector: {app: kafka}
  ports:
  - {name: kafka, port: 9092, targetPort: kafka}
