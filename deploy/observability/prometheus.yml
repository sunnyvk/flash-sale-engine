# Prometheus scrape configuration. Targets are compose service names on the internal network: nothing here is
# reachable from outside, and /actuator/prometheus is not routed by nginx.
global:
  scrape_interval: 15s          # 15 s is the usual balance between resolution and storage
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: booking-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["booking-service:8081"]
  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8082"]
  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8083"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
