spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:mysql://localhost:3306/payment_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${PAYMENT_DB_USER}
    password: ${PAYMENT_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest      # a brand-new consumer group must not skip events published before it started
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:                          # used by the outbox relay and by retry/dead-letter publishing
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000
    listener:
      ack-mode: record

payment:
  outbox:
    enabled: ${OUTBOX_ENABLED:true}    # false switches off ALL Kafka messaging in this service (tests without Kafka)
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    poll-interval: ${OUTBOX_POLL_INTERVAL:PT0.5S}
    send-timeout: ${OUTBOX_SEND_TIMEOUT:PT5S}
    retention: ${OUTBOX_RETENTION:P7D}
  retry:
    attempts: ${PAYMENT_RETRY_ATTEMPTS:4}               # 1 first try + 3 retries, then the dead-letter topic
    delay-ms: ${PAYMENT_RETRY_DELAY_MS:2000}
    multiplier: ${PAYMENT_RETRY_MULTIPLIER:2.0}
    max-delay-ms: ${PAYMENT_RETRY_MAX_DELAY_MS:30000}
  gateway:                             # the payment provider is simulated; these switches demo the failure paths
    declined-user-ids: ${PAYMENT_DEMO_DECLINED_USER_IDS:}   # comma list: card declined (business failure => compensation)
    outage-user-ids: ${PAYMENT_DEMO_OUTAGE_USER_IDS:}       # comma list: provider down (technical failure => retries, then DLT)

kafka:
  topics:
    partitions: ${KAFKA_TOPIC_PARTITIONS:3}
    replicas: ${KAFKA_TOPIC_REPLICAS:1}

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${HEALTH_DETAILS:never}

logging:
  structured:
    format:
      console: ecs
  level:
    root: ${LOG_LEVEL:INFO}
